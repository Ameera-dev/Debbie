name: debbie
description: A mindful money companion that connects spending to personal values.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # UI & Theming
  google_fonts: ^6.1.0

  # Charts / Custom painting
  fl_chart: ^0.68.0

  # Image handling
  image_picker: ^1.0.0
  flutter_image_compress: ^2.1.0
  photo_view: ^0.15.0
  archive: ^3.4.0

  # Google integration
  google_sign_in: ^6.2.0
  googleapis: ^13.0.0
  http: ^1.2.0

  # Utilities
  uuid: ^4.3.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  csv: ^6.0.0
  excel: ^4.0.6

  # Calendar
  table_calendar: ^3.1.0

  # AI
  google_generative_ai: ^0.4.6

  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "assets/app_icon_adaptive_background.png"
  adaptive_icon_foreground: "assets/app_icon_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true

flutter:
  uses-material-design: true
