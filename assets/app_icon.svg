      <path d="M -50 780 Q 250 660 520 760 T 1080 740 L 1080 1100 L -50 1100 Z" fill="url(#wave)"></path>
      <path d="M -50 860 Q 220 760 500 840 T 1080 830 L 1080 1100 L -50 1100 Z" fill="#294956"></path>
